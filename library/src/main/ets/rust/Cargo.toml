[package]
name = "protobuf-rs-ohos"
version = "1.0.0"
edition = "2021"
authors = ["LuuuXXX"]
description = "High-performance Protocol Buffers for OpenHarmony"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-ohos = { version = "1.1.0", default-features = false, features = [
    "napi8",
] }
napi-derive-ohos = "1.0"
byteorder = "1.5"

[build-dependencies]
napi-build-ohos = "1.1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
